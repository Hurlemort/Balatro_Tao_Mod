[manifest]
version = "1.0.0"
priority = 0

# Once a blind's dollar reward is >= $10, drawing that many individual "$"
# glyphs in a row overflows the little reward box and wrecks the UI. From
# $10 up, show "$10+" style text instead of a wall of dollar-sign icons.
# Below $10, behaviour is unchanged (still draws the icons one by one,
# same as vanilla). The end-of-blind reward popup (shown after you beat a
# blind) is a separate code path and is deliberately NOT touched.
#
# NOTE: Lovely's pattern-type patches match whole lines, not substrings
# within a line - an earlier version of this file only matched the
# "string.rep(...)" fragment and silently produced "no matches" (visible
# in Mods/lovely/log/*.log) because it was embedded mid-line inside a
# much longer statement. Both patterns below now spell out the FULL
# line (minus leading indentation, which match_indent restores).

# Spot 1: the ante "map" screen where you choose to skip or play a blind
# (create_UIBox_blind_choice, the upcoming/current/defeated blind row).
[[patches]]
[patches.pattern]
target = "functions/UI_definitions.lua"
pattern = "{n=G.UIT.T, config={text = string.rep(localize(\"$\"), blind_choice.config.dollars)..'+', scale = 0.35, colour = disabled and G.C.UI.TEXT_INACTIVE or G.C.MONEY, shadow = not disabled}}"
position = "at"
payload = "{n=G.UIT.T, config={text = (blind_choice.config.dollars >= 10 and (localize(\"$\")..blind_choice.config.dollars..'+')) or (string.rep(localize(\"$\"), blind_choice.config.dollars)..'+'), scale = 0.35, colour = disabled and G.C.UI.TEXT_INACTIVE or G.C.MONEY, shadow = not disabled}}"
match_indent = true

# Spot 2: hovering a blind in the run info/collection screen
# (create_UIBox_blind_popup, the tooltip shown by create_UIBox_your_collection_blinds).
# Vanilla never had a "+" here at all (just the raw icon count or '-' for
# no reward) - added one to match spot 1's convention once it collapses
# to text, per request. Below $10 / no reward, behaviour is unchanged.
[[patches]]
[patches.pattern]
target = "functions/UI_definitions.lua"
pattern = "{n=G.UIT.O, config={object = DynaText({string = {_dollars and string.rep(localize('$'),_dollars) or '-'}, colours = {G.C.MONEY}, rotate = true, bump = true, silent = true, scale = 0.45})}},"
position = "at"
payload = "{n=G.UIT.O, config={object = DynaText({string = {_dollars and ((_dollars >= 10 and (localize('$').._dollars..'+')) or string.rep(localize('$'),_dollars)) or '-'}, colours = {G.C.MONEY}, rotate = true, bump = true, silent = true, scale = 0.45})}},"
match_indent = true

# Spot 3: the top-left HUD reward text while a blind is actually being played
# (Blind:set_blind, sets G.GAME.current_round.dollars_to_be_earned when the
# blind becomes the current one for the round - this is what G.HUD_blind
# actually reads from during play).
[[patches]]
[patches.pattern]
target = "blind.lua"
pattern = "G.GAME.current_round.dollars_to_be_earned = self.dollars > 0 and (string.rep(localize('$'), self.dollars)..'') or ('')"
position = "at"
payload = "G.GAME.current_round.dollars_to_be_earned = self.dollars > 0 and ((self.dollars >= 10 and (localize('$')..self.dollars..'+')) or (string.rep(localize('$'), self.dollars)..'')) or ('')"
match_indent = true

# Spot 4: same HUD text, but set from Blind:load (restoring a blind's state
# when a save is reloaded mid-blind) instead of Blind:set_blind.
[[patches]]
[patches.pattern]
target = "blind.lua"
pattern = "G.GAME.current_round.dollars_to_be_earned = string.rep(localize('$'), self.dollars)..''"
position = "at"
payload = "G.GAME.current_round.dollars_to_be_earned = (self.dollars >= 10 and (localize('$')..self.dollars..'+')) or (string.rep(localize('$'), self.dollars)..'')"
match_indent = true

# blind-select screen computes its own preview number before set_blind runs, so a
# flat_chips blind (sans) would still advertise the full ante-scaled requirement there
[[patches]]
[patches.pattern]
target = "functions/UI_definitions.lua"
pattern = "local blind_amt = get_blind_amount(G.GAME.round_resets.blind_ante)*blind_choice.config.mult*G.GAME.starting_params.ante_scaling"
position = "at"
payload = "local blind_amt = blind_choice.config.flat_chips or (get_blind_amount(G.GAME.round_resets.blind_ante)*blind_choice.config.mult*G.GAME.starting_params.ante_scaling)"
match_indent = true
