[manifest]
version = "1.0.0"
dump_lua = true
priority = -1

[[patches]]
[patches.pattern]
target = "functions/misc_functions.lua"
pattern = '''
if card.config.center.set == 'Tarot' or card.config.center.set == 'Planet' then 
        G.E_MANAGER:add_event(Event({
          trigger = 'immediate',
          func = function()
            G.E_MANAGER:add_event(Event({
              trigger = 'immediate',
              func = function()
                G.GAME.last_tarot_planet = card.config.center_key
                  return true
              end
            }))
              return true
          end
        }))
      end'''
position = "at"
payload = '''
if #SMODS.find_card("j_tao_flibidi") > 0 or (card.config.center.set == 'Tarot' or card.config.center.set == 'Planet') then
        G.E_MANAGER:add_event(Event({
          trigger = 'immediate',
          func = function()
            G.E_MANAGER:add_event(Event({
              trigger = 'immediate',
              func = function()
                G.GAME.last_tarot_planet = card.config.center_key
                  return true
              end
            }))
              return true
          end
        }))
      end'''
match_indent = true

[[patches]]
[patches.pattern]
target = "card.lua"
pattern = "local card = create_card('Tarot_Planet', G.consumeables, nil, nil, nil, nil, G.GAME.last_tarot_planet, 'fool')"
position = "at"
payload = "local card = create_card(G.P_CENTERS[G.GAME.last_tarot_planet].set, G.consumeables, nil, nil, nil, nil, G.GAME.last_tarot_planet, 'fool')"
match_indent = true

[[patches]]
[patches.pattern]
target = "card.lua"
pattern = "if (self.ability.set == 'Planet' or (self.ability.set == 'Booster' and self.ability.name:find('Celestial'))) and #find_joker('Astronomer') > 0 then self.cost = 0 end"
position = "after"
payload = '''
if (self.ability.set == 'Planet' or (self.ability.set == 'Booster' and self.ability.name:find('Celestial'))) and #SMODS.find_card("j_tao_stargazer") > 0 then
    self.cost = math.floor(self.cost * (G.P_CENTERS.j_tao_stargazer.config.extra.cost_mult ^ #SMODS.find_card("j_tao_stargazer")))
end
'''
match_indent = true

[[patches]]
[patches.pattern]
target = "game.lua"
pattern = "hands = {"
position = "before"
payload = '''
lagrange = { rank = "Ace", suit = "Spades", id = 14, triggers = 0},
'''
match_indent = true

# Record/Puzzle screen effects moved to real SMODS.ScreenShader entries (items/blinds.lua) - no more unconditional per-frame canvas patch here

# remaps cursor hit-testing (G.CURSOR.T/VT) to match the active screen effect's distortion
[[patches]]
[patches.pattern]
target = "engine/controller.lua"
pattern = '''
        self.cursor_position.x, self.cursor_position.y = love.mouse.getPosition()
        G.CURSOR.T.x = self.cursor_position.x/(G.TILESCALE*G.TILESIZE)
        G.CURSOR.T.y = self.cursor_position.y/(G.TILESCALE*G.TILESIZE)
        G.CURSOR.VT.x = G.CURSOR.T.x
        G.CURSOR.VT.y = G.CURSOR.T.y'''
position = "after"
payload = '''
local _effect = Tao.funcs.get_active_screen_effect()
if _effect then
    local _ux, _uy = _effect.remap_point(self.cursor_position.x, self.cursor_position.y)
    G.CURSOR.T.x = _ux/(G.TILESCALE*G.TILESIZE)
    G.CURSOR.T.y = _uy/(G.TILESCALE*G.TILESIZE)
    G.CURSOR.VT.x = G.CURSOR.T.x
    G.CURSOR.VT.y = G.CURSOR.T.y
end
'''
match_indent = true



# holds scoring until boss_math's equation overlay is solved or failed (Tao.funcs.equation_gate, items/blinds.lua)
[[patches]]
[patches.pattern]
target = "functions/state_events.lua"
pattern = '''
                    func = function()
                        G.FUNCS.evaluate_play()
                        return true
                    end'''
position = "at"
payload = '''
func = function()
    if Tao.funcs.equation_gate() then
        return false
    end
    Tao.equation.active = false
    G.FUNCS.evaluate_play()
    return true
end
'''
match_indent = true

# Sixth Sense also triggers on Oops!-boosted cards; anchored on a fragment so other mods' patches don't win
[[patches]]
[patches.pattern]
target = "card.lua"
pattern = "context.full_hand[1]:get_id() == 6"
position = "at"
payload = "Tao.funcs.is_it_a_six(context.full_hand[1])"
match_indent = true

# Even Steven also fires on an odd card if Oops! All 6s is boosting it, since a 6 is even
[[patches]]
[patches.pattern]
target = "card.lua"
pattern = '''
                if self.ability.name == 'Even Steven' and
                context.other_card:get_id() <= 10 and 
                context.other_card:get_id() >= 0 and
                context.other_card:get_id()%2 == 0
                then'''
position = "at"
payload = '''
if self.ability.name == 'Even Steven' and
    (Tao.funcs.is_it_a_six(context.other_card) or (
        context.other_card:get_id() <= 10 and
        context.other_card:get_id() >= 0 and
        context.other_card:get_id()%2 == 0
    ))
then'''
match_indent = true